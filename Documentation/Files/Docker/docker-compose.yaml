services:
  pc-humble:
    image: manelpuig/ros2-humble-ub-ur5e:realsense
    container_name: pc_humble_ur5e

    privileged: true
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    restart: unless-stopped
   
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=5 # ⚠️ numero del grup/robot (1,2,3,4)
      # X11 / rendering
      - DISPLAY=${DISPLAY} # Ubuntu
      #- DISPLAY=host.docker.internal:0.0 # Windows
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_GL_VERSION_OVERRIDE=2.1

    volumes:
      - /dev:/dev
      - /dev/bus/usb:/dev/bus/usb
      - /run/udev:/run/udev:ro
      # Entry point script
      - ./entrypoint_pc.sh:/entrypoint_pc.sh:ro
      # Timezone from host (for correct log timestamps)
      - /etc/localtime:/etc/localtime:ro
      # X11 display for RViz/Gazebo
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Repository mounted inside the container
      - /home/biorob/Desktop/UR5e_social_robotics:/root/UR5e_social_robotics

    entrypoint: /entrypoint_pc.sh
    command: sleep infinity
